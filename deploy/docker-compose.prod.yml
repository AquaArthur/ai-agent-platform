services:

  # ============================
  # MySQL 数据库
  # ============================
  mysql:
    image: mysql:8
    container_name: aiagent-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/2-data.sql

  # ============================
  # Redis（Celery 消息队列 & 结果后端）
  # ============================
  redis:
    image: redis:7-alpine
    container_name: aiagent-redis
    restart: always
    ports:
      - "6379:6379"         
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # ============================
  # 后端 Spring Boot
  # ============================
  backend:
    build:
      context: ../backend/core
      dockerfile: Dockerfile
    container_name: aiagent-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  # ============================
  # 前端 Nginx
  # ============================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aiagent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  # ============================
  # KB（知识库服务）
  # ============================
  kb:
    build:
      context: ../backend/kb       
      dockerfile: Dockerfile
    container_name: aiagent-kb
    restart: always
    depends_on:
      - mysql              # kb 依赖 mysql
    ports:
      - "9000:8000"        # 避免与其他 8000 端口冲突
    environment:
      PYTHONUNBUFFERED: "1"
      KB_ENV: "production"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_URL: redis://redis:6379/1

  # ============================
  # Celery Worker（处理异步任务）
  # ============================
  celery-worker:
    build:
      context: ../backend/kb       # 与 kb 服务使用相同的 Dockerfile
      dockerfile: Dockerfile
    container_name: aiagent-celery
    restart: always
    depends_on:
      - redis                     # 必须等 Redis 启动
      - kb                        # 可选：确保 KB 已经可用（如果任务需要调用 KB 接口）
    environment:
      # 下面的变量可以在 .env 中统一管理，也可以直接写死
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_URL: redis://redis:6379/1
      # 其它 KB 需要的环境变量（如 DB 连接）也要写进去
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    # 这里使用 Celery 官方推荐的启动命令
    command: >
      bash -c "pip install -r /app/requirements.txt && \
               celery -A kb.celery_app.celery worker \
               --loglevel=info \
               --concurrency=4 \
               --queues=default"
    # 将日志直接输出到 stdout，便于 `docker compose logs -f celery-worker` 查看
    tty: true

volumes:
  mysql-data:
  redis-data:

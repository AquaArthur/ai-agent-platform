services:

  # ============================
  # MySQL 数据库
  # ============================
  mysql:
    image: mysql:8
    container_name: aiagent-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/2-data.sql

  # ============================
  # 后端 Spring Boot
  # ============================
  backend:
    build:
      context: ../backend/core
      dockerfile: Dockerfile
    container_name: aiagent-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  # ============================
  # 前端 Nginx
  # ============================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aiagent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  # ============================
  # KB（知识库服务）
  # ============================
  kb:
    build:
      context: ../backend/kb       
      dockerfile: Dockerfile
    container_name: aiagent-kb
    restart: always
    depends_on:
      - mysql              # kb 依赖 mysql
    ports:
      - "9000:8000"        # 避免与其他 8000 端口冲突
    environment:
      PYTHONUNBUFFERED: "1"
      KB_ENV: "production"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}


volumes:
  mysql-data:
